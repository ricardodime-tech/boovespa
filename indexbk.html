<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOVESPA - Cotações</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #004a80;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .positivo {
            color: green;
            font-weight: bold;
        }
        .negativo {
            color: red;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            font-size: 18px;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Painel BOVESPA - Ações</h1>
    <div id="loading" class="loading">Carregando dados do MongoDB...</div>
    <table id="tabela-acoes" style="display: none;">
        <thead>
            <tr>
                <th>Ticker</th>
                <th>Nome</th>
                <th>Negócios</th>
                <th>Cotação (R$)</th>
                <th>Variação</th>
            </tr>
        </thead>
        <tbody id="corpo-tabela">
            <!-- Dados inseridos via JavaScript -->
        </tbody>
    </table>
</div>

<script>
    async function carregarAcoes() {
        try {
            const response = await fetch('/api/acoes');
            const acoes = await response.json();
            
            const corpoTabela = document.getElementById('corpo-tabela');
            const loading = document.getElementById('loading');
            const tabela = document.getElementById('tabela-acoes');

            corpoTabela.innerHTML = '';

            if (acoes.length === 0) {
                loading.innerHTML = 'Nenhum dado encontrado na coleção.';
                return;
            }

            acoes.forEach(acao => {
                const tr = document.createElement('tr');
                
                // Formatação simples para variação (caso venha com sinal ou texto)
                const variacaoStr = String(acao.Variacao || '');
                const classeVariacao = variacaoStr.includes('-') ? 'negativo' : 'positivo';

                tr.innerHTML = `
                    <td><strong>${acao.Ticker || '-'}</strong></td>
                    <td>${acao.Nome || '-'}</td>
                    <td>${acao.Negocios || '-'}</td>
                    <td>${acao.Cotacao !== undefined && acao.Cotacao !== null ? acao.Cotacao : '-'}</td>
                    <td class="${classeVariacao}">${acao.Variacao || '-'}</td>
                `;
                corpoTabela.appendChild(tr);
            });

            loading.style.display = 'none';
            tabela.style.display = 'table';
        } catch (error) {
            console.error('Erro ao carregar tabela:', error);
            document.getElementById('loading').innerHTML = 'Erro ao carregar os dados.';
        }
    }

    carregarAcoes();
</script>

</body>
</html>
