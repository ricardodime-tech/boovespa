<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOVESPA - Cotações</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #eef3f5;
            color: #1f2937;
        }

        .positivo {
            color: #16a34a;
            font-weight: bold;
        }

        .negativo {
            color: #dc2626;
            font-weight: bold;
        }

        .neutral {
            color: #64748b;
            font-weight: bold;
        }

        .cursor-pointer {
            cursor: pointer;
            user-select: none;
        }

        .cursor-pointer:hover {
            background-color: #1e293b !important;
        }

        .ticker-btn {
            background: transparent;
            border: none;
            color: #0f172a;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            padding: 0;
            text-align: left;
        }

        .ticker-btn:hover {
            color: #2563eb;
            text-decoration: underline;
        }

        .chart-tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.92);
            color: #fff;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            line-height: 1.35;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.18);
            transform: translate(12px, 12px);
            white-space: nowrap;
            zIndex: 10;
        }
    </style>
</head>
<body class="py-4">

<div class="container bg-white p-4 rounded-4 shadow-sm" style="max-width: 1100px;">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <h1 class="h2 text-dark m-0 fw-bold">Painel BOVESPA - Ações</h1>

        <div class="d-flex align-items-center flex-wrap gap-2">
            <input
                id="filtroTicker"
                class="form-control"
                type="text"
                placeholder="Buscar por ticker..."
                autocomplete="off"
                style="min-width: 200px;"
            >
            <span id="ultimaAtualizacao" class="badge bg-light text-secondary border px-3 py-2 fs-6">Última atualização: --</span>
            <button id="btnAtualizarCotacoes" class="btn btn-primary fw-semibold">Atualizar cotações</button>
        </div>
    </div>

    <div id="loading" class="d-flex justify-content-center align-items-center gap-2 text-muted fs-5 my-5">
        <div class="spinner-border text-primary" role="status" style="width: 1.5rem; height: 1.5rem;"></div>
        <span>Carregando dados do MongoDB....</span>
    </div>

    <div class="table-responsive">
        <table id="tabela-acoes" class="table table-hover align-middle d-none">
            <thead class="table-dark">
                <tr>
                    <th>Ticker</th>
                    <th>Nome</th>
                    <th>Cotação (R$)</th>
                    <th id="thVariacao" class="cursor-pointer" title="Clique para ordenar por variação">
                        Variação <i id="iconeOrdenacao" class="bi bi-arrow-down-up small ms-1"></i>
                    </th>
                </tr>
            </thead>
            <tbody id="corpo-tabela"></tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="graficoModal" class="modal fade" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content rounded-4 p-3 shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h5 id="modalTitulo" class="modal-title fw-bold">Gráfico do ativo</h5>
                <button id="fecharModal" type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div id="modalGrafico" class="d-flex justify-content-center align-items-center position-relative" style="min-height: 420px;">
                    <div class="d-flex align-items-center gap-2 text-muted">
                        <div class="spinner-border text-primary" role="status"></div>
                        <span>Carregando gráfico...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const BRAPI_TOKEN = 'sAtztXoEBCxuvHFsvJ4QFr';
    let listaAcoesGlobal = [];
    let direcaoOrdenacao = 0; // 0: original, 1: descrescente (maior variação primeiro), -1: crescente

    function formatarUltimaAtualizacao() {
        const el = document.getElementById('ultimaAtualizacao');
        el.textContent = `Última atualização: ${new Date().toLocaleString('pt-BR')}`;
    }

    function formatarVariacao(variacao, variacaoPercentual) {
        if (
            variacao === undefined ||
            variacao === null ||
            variacao === '' ||
            Number(variacao) === 0
        ) {
            return { texto: '-', classe: 'neutral', valorNumerico: 0 };
        }

        const valor = Number(variacao);
        const percentual = Number(variacaoPercentual ?? 0);

        const sinal = valor > 0 ? '+' : '';
        const classe = valor > 0 ? 'positivo' : valor < 0 ? 'negativo' : 'neutral';

        return {
            texto: `${sinal}${valor.toFixed(2)} (${sinal}${percentual.toFixed(2)}%)`,
            classe,
            valorNumerico: percentual // Usando o percentual como base de ordenação
        };
    }

    function aplicarFiltroTicker() {
        const filtro = document.getElementById('filtroTicker').value.trim().toUpperCase();
        const linhas = document.querySelectorAll('#corpo-tabela tr');

        linhas.forEach((linha) => {
            const ticker = (linha.dataset.ticker || '').toUpperCase();
            const visivel = !filtro || ticker.includes(filtro);
            linha.style.display = visivel ? '' : 'none';
        });
    }

    function normalizarTicker(ticker) {
        return String(ticker || '').trim().replace(/\.SA$/i, '').replace(/\s+/g, '').toUpperCase();
    }

    function extrairValorPreco(item) {
        if (typeof item === 'number') return Number(item);
        if (!item || typeof item !== 'object') return null;

        const candidatos = [
            item.close, item.price, item.value, item.priceClose,
            item.adjclose, item.last, item.regularMarketPrice, item.prevClose, item.closePrice
        ];

        for (const valor of candidatos) {
            const numero = Number(valor);
            if (Number.isFinite(numero) && numero > 0) return numero;
        }
        return null;
    }

    function extrairDataHistorico(item) {
        if (!item || typeof item !== 'object') return null;
        return item.date || item.datetime || item.timestamp || item.time || item.day || item.period;
    }

    function converterHistoricoEmPontos(historico) {
        if (!Array.isArray(historico)) return [];
        return historico
            .map((item) => {
                const valor = extrairValorPreco(item);
                const data = extrairDataHistorico(item);
                if (!Number.isFinite(valor) || valor <= 0 || !data) return null;
                return { valor, data };
            })
            .filter(Boolean)
            .slice(-120);
    }

    function desenharGrafico(canvas, pontos, ticker, precoAtual = null, nomeAtivo = '') {
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#f4f7f9';
        ctx.fillRect(0, 0, width, height);

        const simbolo = normalizarTicker(ticker);
        const nomeExibicao = nomeAtivo || simbolo || 'Ativo';
        const valorAtual = Number(precoAtual ?? pontos[pontos.length - 1]?.valor ?? 0);
        const minValor = Math.min(...pontos.map((p) => p.valor));
        const maxValor = Math.max(...pontos.map((p) => p.valor));

        const padding = { top: 82, right: 22, bottom: 55, left: 66 };
        const plotWidth = width - padding.left - padding.right;
        const plotHeight = height - padding.top - padding.bottom;

        const coordenadas = pontos.map((ponto, indice) => {
            const x = padding.left + (plotWidth * indice) / Math.max(1, pontos.length - 1);
            const y = padding.top + ((maxValor - ponto.valor) / (maxValor - minValor || 1)) * plotHeight;
            return { ...ponto, x, y };
        });

        ctx.fillStyle = '#1f2937';
        ctx.textAlign = 'left';
        ctx.font = '700 20px Arial';
        ctx.fillText(nomeExibicao, padding.left, 30);

        ctx.fillStyle = '#0f9f6e';
        ctx.font = '700 24px Arial';
        ctx.fillText(`R$ ${valorAtual.toFixed(2)}`, padding.left, 62);

        // Grid e linhas de eixo omitidas por brevidade, mantendo funcionalidade...
        // Linha principal do gráfico
        ctx.beginPath();
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 2.5;
        coordenadas.forEach((ponto, indice) => {
            if (indice === 0) ctx.moveTo(ponto.x, ponto.y);
            else ctx.lineTo(ponto.x, ponto.y);
        });
        ctx.stroke();

        const canvasEl = canvas;
        const modal = canvasEl.closest('.modal-body');
        let tooltip = modal ? modal.querySelector('#chartTooltip') : null;

        if (!tooltip) {
            tooltip = document.createElement('div');
            tooltip.id = 'chartTooltip';
            tooltip.className = 'chart-tooltip hidden';
            if (modal) modal.appendChild(tooltip);
        }

        canvasEl.onmousemove = (event) => {
            const rect = canvasEl.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            let pontoMaisProximo = null;
            let menorDistancia = Number.POSITIVE_INFINITY;

            coordenadas.forEach((ponto) => {
                const distancia = Math.hypot(x - ponto.x, y - ponto.y);
                if (distancia < menorDistancia) {
                    menorDistancia = distancia;
                    pontoMaisProximo = ponto;
                }
            });

            if (!pontoMaisProximo || menorDistancia > 28) {
                tooltip?.classList.add('hidden');
                return;
            }

            const data = new Date((Number(pontoMaisProximo.data) || Date.now()) * 1000);
            tooltip.innerHTML = `<strong>R$ ${Number(pontoMaisProximo.valor).toFixed(2)}</strong><br>${data.toLocaleDateString('pt-BR')}`;
            tooltip.style.left = `${Math.min(x + 12, rect.width - 120)}px`;
            tooltip.style.top = `${Math.max(y - 40, 8)}px`;
            tooltip.classList.remove('hidden');
        };

        canvasEl.onmouseleave = () => {
            tooltip?.classList.add('hidden');
        };
    }

    async function carregarGraficoAtivo(ticker) {
        const modalTitulo = document.getElementById('modalTitulo');
        const modalGrafico = document.getElementById('modalGrafico');
        const simbolo = normalizarTicker(ticker);

        modalTitulo.textContent = `Gráfico de ${simbolo}`;
        modalGrafico.innerHTML = `
            <div class="d-flex align-items-center gap-2 text-muted">
                <div class="spinner-border text-primary" role="status"></div>
                <span>Carregando gráfico...</span>
            </div>
        `;

        try {
            const ranges = ['3mo', '1mo', '5d', '1d'];
            let historico = [];
            let ultimoPreco = null;
            let nomeAtivo = '';

            for (const range of ranges) {
                const response = await fetch(`https://brapi.dev/api/quote/${encodeURIComponent(simbolo)}?range=${range}&interval=1d&token=${BRAPI_TOKEN}`);
                const data = await response.json();

                if (data?.error) continue;

                const resultado = data?.results?.[0] || data?.data?.[0] || data;
                nomeAtivo = resultado?.longName || resultado?.shortName || nomeAtivo || simbolo;
                ultimoPreco = Number(resultado?.regularMarketPrice ?? resultado?.price ?? 0);

                historico = converterHistoricoEmPontos(
                    resultado?.historicalDataPrice || resultado?.historical || resultado?.history || []
                );

                if (historico.length) break;
            }

            if (!historico.length) throw new Error('Nenhum dado histórico disponível.');

            const canvas = document.createElement('canvas');
            canvas.width = 900;
            canvas.height = 420;
            canvas.style.width = '100%';
            canvas.style.height = 'auto';
            canvas.style.borderRadius = '8px';

            modalGrafico.innerHTML = '';
            modalGrafico.appendChild(canvas);

            desenharGrafico(canvas, historico, simbolo, ultimoPreco || historico[historico.length - 1]?.valor, nomeAtivo);
        } catch (error) {
            modalGrafico.innerHTML = `<div class="text-danger fw-semibold text-center">Não foi possível carregar o gráfico de ${simbolo}.</div>`;
        }
    }

    function renderizarTabela(acoes) {
        const corpoTabela = document.getElementById('corpo-tabela');
        corpoTabela.innerHTML = '';

        acoes.forEach((acao) => {
            const tr = document.createElement('tr');
            const ticker = acao.codigo || acao.sigla || acao.acao || acao.ticker || acao.Ticker || '-';
            const nome = acao.nome || acao.Nome || acao.empresa || acao.Empresa || '-';
            const preco = acao.preco_atual ?? acao.Cotacao ?? acao.preco ?? '-';

            const variacao = acao.variacao ?? undefined;
            const variacaoPercentual = acao.variacao_percent ?? undefined;
            const resultadoVariacao = formatarVariacao(variacao, variacaoPercentual);

            tr.dataset.ticker = String(ticker);
            tr.innerHTML = `
                <td><button type="button" class="ticker-btn" data-ticker="${String(ticker).replace(/"/g, '&quot;')}" data-nome="${String(nome).replace(/"/g, '&quot;')}"><strong>${ticker}</strong></button></td>
                <td>${nome}</td>
                <td>${preco !== '-' ? Number(preco).toFixed(2) : '-'}</td>
                <td class="${resultadoVariacao.classe}">${resultadoVariacao.texto}</td>
            `;
            corpoTabela.appendChild(tr);
        });

        document.getElementById('loading').classList.add('d-none');
        document.getElementById('tabela-acoes').classList.remove('d-none');
        formatarUltimaAtualizacao();
        aplicarFiltroTicker();
    }

    async function carregarAcoes() {
        try {
            const response = await fetch('/api/acoes');
            const acoes = await response.json();

            if (!Array.isArray(acoes) || acoes.length === 0) {
                document.getElementById('loading').innerHTML = 'Nenhum dado encontrado na coleção.';
                return;
            }

            listaAcoesGlobal = acoes;
            renderizarTabela(listaAcoesGlobal);
        } catch (error) {
            document.getElementById('loading').innerHTML = 'Erro ao carregar os dados.';
        }
    }

    // Ordenação por Variação
    document.getElementById('thVariacao').addEventListener('click', () => {
        direcaoOrdenacao = (direcaoOrdenacao + 2) % 3 - 1; // Alterna entre 1 (desc), -1 (asc), e 0 (original)
        const icone = document.getElementById('iconeOrdenacao');

        let acoesOrdenadas = [...listaAcoesGlobal];

        if (direcaoOrdenacao === 1) {
            icone.className = 'bi bi-arrow-up text-primary small ms-1';
            acoesOrdenadas.sort((a, b) => {
                const varA = Number(a.variacao_percent ?? a.variacao ?? 0);
                const varB = Number(b.variacao_percent ?? b.variacao ?? 0);
                return varB - varA; // Maior alta primeiro
            });
        } else if (direcaoOrdenacao === -1) {
            icone.className = 'bi bi-arrow-down text-primary small ms-1';
            acoesOrdenadas.sort((a, b) => {
                const varA = Number(a.variacao_percent ?? a.variacao ?? 0);
                const varB = Number(b.variacao_percent ?? b.variacao ?? 0);
                return varA - varB; // Menor variação / queda primeiro
            });
        } else {
            icone.className = 'bi bi-arrow-down-up small ms-1';
        }

        renderizarTabela(acoesOrdenadas);
    });

    document.getElementById('corpo-tabela').addEventListener('click', (event) => {
        const botaoTicker = event.target.closest('.ticker-btn');
        if (!botaoTicker) return;

        const modalEl = document.getElementById('graficoModal');
        const modal = new bootstrap.Modal(modalEl);
        modal.show();
        carregarGraficoAtivo(botaoTicker.dataset.ticker);
    });

    document.getElementById('filtroTicker').addEventListener('input', aplicarFiltroTicker);

    document.getElementById('btnAtualizarCotacoes').addEventListener('click', async () => {
        const btn = document.getElementById('btnAtualizarCotacoes');
        btn.disabled = true;
        btn.textContent = 'Atualizando...';

        try {
            const response = await fetch('/api/acoes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao atualizar');
            await carregarAcoes();
        } catch (error) {
            alert(error.message);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Atualizar cotações';
        }
    });

    carregarAcoes();
</script>

</body>
</html>
